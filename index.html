<script id="theme-controller">
(function(){
  try {
    var saved = localStorage.getItem('cg_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
function toggleTheme(){
  var root=document.documentElement;
  var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',next);
  try{localStorage.setItem('cg_theme',next)}catch(e){}
  var b=document.getElementById('theme-toggle');
  if(b){b.textContent=next==='dark'?'☀':'☾';b.setAttribute('aria-label',next==='dark'?'Switch to light mode':'Switch to dark mode');b.setAttribute('title',next==='dark'?'Light mode':'Dark mode');}
}
</script>

are professional course exam stages, training articleship/practical requirements, pass rates and time commitment.","Check whether the degree is recognised and whether mathematics is required for a target programme.","Build communication, spreadsheet, accounting and analytical skills alongside the degree."],"steps":["Choose between accounting/finance, business/management, law, economics or public service.","Compare course syllabi, professional exam structures and costs.","Start foundational accounting, business writing and spreadsheet practice.","Seek supervised projects, internships or volunteering.","Review progress each semester and adjust the target."],"skills":["Accounting and financial literacy","Excel or spreadsheet modelling","Business communication and analytical writing"],"projects":["Prepare a simple monthly budget and financial statement","Create a market or company case study"],"exams":["CA Foundation / CMA Foundation / CS CSEET as applicable","CLAT or other law entrance tests where relevant","CUET and university admissions where applicable"],"caution":"Professional qualification routes and eligibility can change; verify with ICAI, ICMAI, ICSI or the relevant university."},"hec":{"title":"Intermediate HEC / Humanities","simple":"Humanities can lead to law, social sciences, public policy, media, design, education, languages and civil services. It is not a limited career stream.","paths":["BA programmes: political science, history, psychology, economics, sociology and languages.","Law, journalism, communication, design and creative programmes.","Education and teaching routes after the required degree and teacher qualifications.","Public administration, development sector, research and civil services after required qualifications."],"advanced":["Check portfolio, aptitude test, language or subject prerequisites for specialised programmes.","For teaching, map the full recognised qualification and teacher eligibility route for the level and state.","Build writing, research, presentation and digital content skills with evidence of work."],"steps":["Identify whether you enjoy writing, people-facing work, research, law, design or teaching.","Compare degree syllabi and entrance requirements.","Create a small writing, design or research portfolio.","Talk to a professional or student in two shortlisted fields.","Verify recognition and eligibility for postgraduate or professional routes."],"skills":["Critical reading and writing","Research and evidence evaluation","Presentation and digital communication"],"projects":["Write a researched article with citations","Create a community issue brief or digital portfolio"],"exams":["CUET / university entrance routes where applicable","CLAT / law entrance tests where applicable","Design or media institute-specific tests"],"caution":"Do not assume one entrance exam is required for every BA or humanities programme; check each institution."},"diploma":{"title":"Polytechnic / ITI / Diploma","simple":"Your technical qualification can lead to skilled employment, apprenticeship, supervisory work or further study. The exact route depends on trade, diploma branch and recognition.","paths":["Apprenticeship and technician roles in relevant trades.","Diploma engineer and junior technical roles where the notification accepts your branch.","Lateral entry to B.Tech/B.E. where the state or institution rules permit.","Specialist certifications and skill upgrades linked to your trade."],"advanced":["Check NCVT/SCVT or applicable technical-board recognition and the exact trade/branch nomenclature.","Recruitment notices often specify branch equivalence; do not assume all diplomas are interchangeable.","For lateral entry, verify entrance, minimum marks, reservation and counselling rules."],"steps":["Confirm your exact qualification, trade/branch, board and completion status.","Map 5 employers or recruitment routes that explicitly accept it.","Build practical evidence: workshop log, drawings, measurements or maintenance records.","Check apprenticeship portals and current recruitment notices.","Choose employment or lateral-entry study based on cost and long-term goals."],"skills":["Trade-specific tools and safety","Technical drawing and measurement","Basic computer, reporting and communication"],"projects":["Document a supervised repair, fabrication or wiring project","Create a CAD drawing or process improvement report"],"exams":["State lateral-entry engineering entrance where applicable","Apprenticeship selection and trade tests","SSC JE / RRB / state technical recruitment only where branch eligibility matches"],"caution":"Read the exact branch and qualification wording in every recruitment notice. Apprenticeship is not automatically a permanent job."},"cse":{"title":"B.Tech CSE / IT / AI & Data","simple":"CSE students can build software, data, AI, cybersecurity, cloud, product and research careers. Choose one direction to build depth while keeping core computing fundamentals strong.","paths":["Software engineering: frontend, backend, full-stack, mobile and platform.","Data and AI: analytics, data engineering, machine learning and applied AI.","Cybersecurity, cloud, DevOps, networking and infrastructure.","Higher study, research, teaching, government technical roles and entrepreneurship."],"advanced":["Core foundations: DSA, programming, databases, OS, networks, software engineering and system design.","Build demonstrable projects, Git history, documentation, tests and deployment—not only course certificates.","For AI roles, add statistics, linear algebra, data quality, evaluation and responsible-use knowledge."],"steps":["Choose a primary track and one adjacent track after trying beginner tasks.","Build programming and DSA routine; revise CS fundamentals weekly.","Complete one small project, then one deployed end-to-end project.","Practise interviews and apply for internships early.","Review job descriptions and close skill gaps every 6–8 weeks."],"skills":["One primary language plus DSA","SQL, Git, Linux and testing","Track-specific tools: cloud, web, ML or security"],"projects":["Full-stack app with authentication and tests","Data dashboard or ML project with documented evaluation","Security lab or cloud deployment project in a safe sandbox"],"exams":["GATE CSE for eligible higher-study/PSU routes","Campus and off-campus technical assessments","Relevant university entrance tests for PG"],"caution":"Do not present a tutorial clone as original work. Explain your own contribution, limitations and test results."},"eee":{"title":"B.Tech EEE","simple":"EEE combines electrical machines, power systems, power electronics, control and electronics. You can work in core electrical, EV, automation, embedded, energy or software roles.","paths":["Core electrical: power systems, machines, protection, testing and electrical design.","EV and automotive: motor drives, inverter, BMS, charging, vehicle control and validation.","Automation and embedded: PLC, SCADA, microcontrollers, firmware and industrial control.","Government/PSU, GATE, higher study, research and cross-domain software/data roles."],"advanced":["Core depth: circuits, machines, power systems, power electronics, control systems and measurements.","Tool options: MATLAB/Simulink, ETAP/PowerWorld, AutoCAD Electrical, PLC/SCADA, embedded C and CAN—choose by target role.","For EV roles, connect electrical fundamentals with batteries, motor control, thermal safety and vehicle communication."],"steps":["Select one primary path: core power, EV, automation, embedded or software.","Strengthen 3 relevant core subjects and solve numerical problems weekly.","Learn one industry tool and document a small practical project.","Seek lab work, internship, plant visit or supervised field exposure.","Prepare GATE/PSU or placement plan based on eligibility and target companies."],"skills":["Electrical machines and power systems","Power electronics and control","MATLAB/Simulink, PLC, embedded C or CAD based on chosen track"],"projects":["Closed-loop DC motor speed control or motor-drive simulation","Power factor correction or solar microgrid analysis","EV battery monitoring / CAN demo using safe low-voltage hardware"],"exams":["GATE EE for M.Tech and PSU recruitment where accepted","State AE/AEE, SSC JE and RRB JE where branch eligibility matches","ESE and other technical recruitment subject to current rules"],"caution":"A software tool certificate alone is not job readiness. Demonstrate fundamentals, project decisions, testing and safety."},"ece":{"title":"B.Tech ECE","simple":"ECE connects electronics, communication, signals and computing. You can specialise in semiconductor design, embedded systems, telecom, hardware or software.","paths":["VLSI: RTL design, verification, physical design and semiconductor test.","Embedded and firmware: microcontrollers, drivers, RTOS, IoT and automotive electronics.","Communication, RF, networking, signal processing and wireless systems.","Software, data, AI, government technical roles and higher study."],"advanced":["Core depth: analog/digital electronics, signals and systems, communication, control and semiconductor devices.","Choose tools based on track: Verilog/SystemVerilog, EDA tools, C/C++, Python, MATLAB, PCB CAD or networking labs.","Build a project that includes design constraints, measurement or simulation, test cases and documented results."],"steps":["Try one small digital, embedded and communication task to discover fit.","Choose one specialisation and learn its toolchain.","Build a portfolio project with diagrams, code, test results and a short demo.","Apply to internships and track role-specific prerequisites.","Prepare GATE EC or placements according to your goal."],"skills":["Digital and analog fundamentals","C/C++ or Python and debugging","Verilog/verification, embedded tools or RF/networking by track"],"projects":["FPGA/Verilog peripheral with testbench","Microcontroller sensor node with serial/CAN communication","Signal-processing or communication simulation"],"exams":["GATE EC for higher study/eligible PSU routes","Campus/off-campus semiconductor and embedded assessments","Institution-specific PG entrance routes"],"caution":"VLSI job titles differ substantially. Learn whether a role is design, verification, physical design, validation or production test."},"mech":{"title":"B.Tech Mechanical","simple":"Mechanical engineering leads to design, manufacturing, quality, automotive, thermal, materials, robotics and operations. Digital tools can complement—not replace—engineering fundamentals.","paths":["Design and analysis: CAD, CAE, FEA, CFD and product development.","Manufacturing, production, quality, maintenance and industrial engineering.","Automotive, EV integration, thermal management and mechatronics.","Government engineering, GATE, research, MBA and cross-domain software/data."],"advanced":["Core depth: mechanics, materials, thermodynamics, fluid mechanics, manufacturing and machine design.","Choose CAD/CAE stack based on role; learn GD&T, tolerance, design reviews and manufacturing constraints.","For EV, combine vehicle systems, thermal, materials and basic electrical/electronics understanding."],"steps":["Select design, manufacturing, thermal, automotive or operations.","Learn one CAD/CAE tool and strengthen relevant core subjects.","Complete a drawing, analysis or process-improvement project.","Get workshop, plant or product-development exposure.","Prepare GATE/placements and build a technical portfolio."],"skills":["Engineering drawing and GD&T","CAD/CAE, manufacturing and quality tools","Excel/data analysis and technical communication"],"projects":["Design and analyse a mechanical component","Manufacturing process improvement study","EV thermal or vehicle subsystem concept study"],"exams":["GATE ME for higher study/eligible PSU roles","ESE, SSC JE and state AE where eligible","Recruiter-specific technical assessments"],"caution":"Avoid claiming professional competence from software familiarity alone; validate designs, assumptions and safety factors."},"civil":{"title":"B.Tech Civil","simple":"Civil engineering spans structures, construction, geotechnical, water, transport, surveying and infrastructure management. Field exposure and codes matter.","paths":["Structural design, geotechnical and construction engineering.","Site execution, estimation, contracts, quality and project management.","Transportation, environmental, water resources, surveying and GIS.","Government engineering, GATE, research, planning and real-estate development."],"advanced":["Core depth: structural analysis, RCC/steel, geotechnical, surveying, transportation, hydraulics and construction materials.","Tools may include AutoCAD, STAAD.Pro/ETABS, Civil 3D, GIS, Primavera and estimation software depending on role.","Learn applicable Indian Standards, site safety, quality documentation and measurement practices."],"steps":["Choose design, site, infrastructure, water, transport or project management.","Strengthen relevant core subjects and code-reading habits.","Learn one tool and produce a checked drawing/calculation/report.","Seek supervised site or lab exposure.","Prepare GATE/AE/JE or private-sector portfolio based on target."],"skills":["Engineering drawing and surveying","Structural/soil/materials fundamentals","Estimation, planning and safety"],"projects":["Quantity estimation for a small building","Survey/GIS mapping exercise","Structural analysis model with assumptions and checks"],"exams":["GATE CE for higher study/eligible PSU routes","SSC JE, state AE/AEE and RRB JE where eligible","Institution-specific postgraduate entrances"],"caution":"Design and site decisions require qualified supervision and current codes. Never use a student project as a construction-ready design."},"otherug":{"title":"BCA / B.Sc / B.Com / BA / BBA / Other UG","simple":"A general degree can lead to employment, professional qualifications, competitive exams or postgraduate ion.","paths":["M.Tech/M.E./M.Sc: specialist engineering, science, research and technical roles.","MBA/PGDM: management, consulting, finance, marketing, operations and product roles.","MCA: advanced computing and software roles subject to programme prerequisites.","PhD/research/teaching: academic and R&D pathways with required eligibility and experience."],"advanced":["Define the target role before choosing a thesis, electives or institution.","Compare faculty/lab fit, placement transparency, accreditation, fees, funding and alumni outcomes.","For research, maintain reproducible methods, literature review, ethics and publication quality."],"steps":["Write a target role or research question in one sentence.","Map required specialisation and select relevant electives.","Choose a capstone/thesis aligned with target work.","Build evidence: internship, publication, prototype, case study or deployed system.","Prepare interviews, research applications or teaching eligibility as applicable."],"skills":["Advanced subject fundamentals","Research methods and technical writing","Industry tools and project execution"],"projects":["Industry-aligned capstone with measurable outcomes","Reproducible research or prototype","Business case / consulting project for management students"],"exams":["GATE / JAM / CUET-PG / CAT / other tests depending on course and institution","NET/SET or other teaching eligibility where applicable","PhD entrance and interview as per institution"],"caution":"A postgraduate title does not guarantee a particular job or salary. Evaluate programme quality and target-role fit."},"jobseeker":{"title":"Graduate / Job seeker / Career changer","simple":"Start from your completed qualification, skills, location flexibility and experience. Separate jobs you can apply for now from jobs that need another qualification.","paths":["Private sector: entry-level roles, internships, apprenticeships and graduate trainee programmes.","Government: central, state, PSU, banking, railway, defence and technical recruitment.","Professional qualifications and higher study to unlock specialist roles.","Career transition through a skill bridge, portfolio and demonstrable projects."],"advanced":["Build an eligibility matrix for each vacancy: degree/branch, marks, age, experience, category rules, location and deadlines.","Use official notification PDFs and employer career pages as the source of truth.","Tailor your resume to evidence and role requirements; never fabricate experience or certificates."],"steps":["Record exact qualification, passing year, marks, age and work experience.","Choose 2–3 realistic role families and identify eligibility gaps.","Prepare a role-specific resume and one proof-of-skill project.","Set a weekly application and interview-practice routine.","Track applications, deadlines, feedback and follow-ups."],"skills":["Role-specific technical or professional skills","Resume, communication and interview practice","Digital job search and application tracking"],"projects":["A portfolio piece demonstrating the target role","A case study showing problem, approach, result and limitations"],"exams":["Recruitment tests listed in each official notification","GATE/SSC/Banking/State PSC/PSU exams where eligible","Professional certification only when relevant to target roles"],"caution":"Never pay an unofficial agent for a guaranteed job. Check vacancy authenticity and all eligibility details."}};
